[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.1.0"
description = "Automated document quality testing framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Dmitry Pugachev", email = "mityaefimov@icloud.com"}
]
keywords = ["testing", "qa", "automation", "documents"]
dependencies = [
    "python-docx>=0.8.11",
    "click>=8.0",
]

[project.scripts]
docqa = "docqa.cli:main"

[project.urls]
homepage = "https://github.com/mityaefimov/docqa"
repository = "https://github.com/mityaefimov/docqa"